*{box-sizing:border-box;margin:0;padding:0}
body{font-family:&#39;Segoe UI&#39;,Arial,sans-serif;background:#F4F6FA;color:#111827;font-size:15px}
/* HEADER */
.header{background:linear-gradient(135deg,#101B4D 0%,#263A8B 100%);color:#fff;padding:20px 24px 0;border-bottom:4px solid #F5A51A}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.header-badge{background:#F5A51A;color:#101B4D;font-weight:700;font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.header h1{font-size:1.35rem;font-weight:800;letter-spacing:.5px}
.header p{font-size:.82rem;opacity:.85;margin-bottom:12px}
/* TABS */
.tabs{display:flex;overflow-x:auto;gap:2px;background:#101B4D;padding:0 8px}
.tab-btn{flex:0 0 auto;background:transparent;border:none;color:rgba(255,255,255,.65);padding:11px 13px;font-size:.78rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;white-space:nowrap}
.tab-btn.active{color:#F5A51A;border-bottom:3px solid #F5A51A}
.tab-btn:hover{color:#fff}
/* PROGRESS */
.progress-wrap{background:#fff;padding:12px 20px;border-bottom:1px solid #e5e7eb}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:#6b7280;margin-bottom:6px}
.progress-bg{background:#e5e7eb;border-radius:99px;height:10px;overflow:hidden}
.progress-bar{height:10px;background:linear-gradient(90deg,#263A8B,#F5A51A);border-radius:99px;transition:width .5s}
.dots{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#9ca3af;transition:.3s}
.dot.active{background:#F5A51A;color:#fff}
.dot.done{background:#263A8B;color:#fff}
/* SECTIONS */
.section{display:none;padding:20px 16px;max-width:900px;margin:0 auto}
.section.active{display:block}
/* CARDS */
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:18px;margin-bottom:16px}
.card h2{color:#263A8B;font-size:1.05rem;margin-bottom:10px;border-left:4px solid #F5A51A;padding-left:10px}
.card h3{color:#263A8B;font-size:.95rem;margin:14px 0 6px}
.card p,.card li{font-size:.88rem;line-height:1.7;color:#374151}
.card ul,.card ol{padding-left:18px;margin-bottom:8px}
/* BADGE */
.badge{display:inline-block;background:#263A8B;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:12px;margin:2px 3px}
.badge-gold{background:#F5A51A;color:#101B4D}
.badge-green{background:#16a34a;color:#fff}
/* HIGHLIGHT */
.highlight-box{background:linear-gradient(135deg,#EEF2FF,#E0E7FF);border-left:4px solid #263A8B;border-radius:8px;padding:14px;margin:10px 0;font-size:.87rem}
.warning-box{background:#fff7ed;border-left:4px solid #F5A51A;border-radius:8px;padding:12px;margin:10px 0;font-size:.86rem}
.warning-box strong{color:#b45309}
/* HERO IMAGE */
.hero-img{width:100%;max-width:480px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:block;margin:0 auto 16px}
/* OBJECTIVES */
.obj-list{list-style:none;padding:0}
.obj-list li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:.88rem}
.obj-list li:last-child{border-bottom:none}
.obj-icon{background:#263A8B;color:#fff;border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-top:1px}
/* LEARNING MAP */
.map-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;align-items:center}
.map-step{background:#263A8B;color:#fff;font-size:.72rem;padding:6px 10px;border-radius:6px;font-weight:600}
.map-arrow{color:#F5A51A;font-weight:900;font-size:1rem}
/* SKILL TABLE */
.skill-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:10px 0}
.skill-table th{background:#263A8B;color:#fff;padding:8px 10px;text-align:left}
.skill-table td{padding:7px 10px;border-bottom:1px solid #e5e7eb}
.skill-table tr:nth-child(even) td{background:#f9fafb}
/* COMPONENT GRID */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.comp-card{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:10px;padding:14px 10px;text-align:center;transition:.2s}
.comp-card:hover{border-color:#263A8B;box-shadow:0 2px 8px rgba(38,58,139,.12)}
.comp-icon{font-size:1.8rem;margin-bottom:8px;display:block}
.comp-name{font-weight:700;font-size:.82rem;color:#263A8B;margin-bottom:4px}
.comp-desc{font-size:.75rem;color:#6b7280;line-height:1.4}
/* STEP CARDS */
.step-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step-num{background:#263A8B;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.step-title{font-weight:700;color:#263A8B;font-size:.9rem}
.check-item{display:flex;align-items:flex-start;gap:8px;font-size:.83rem;padding:4px 0;color:#374151}
.check-item::before{content:&quot;[  ]&quot;;font-size:.75rem;color:#9ca3af;flex-shrink:0;margin-top:2px;font-family:monospace}
/* FLOW DIAGRAM */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.flow-box{background:#263A8B;color:#fff;border-radius:8px;padding:8px 12px;font-size:.78rem;font-weight:600;text-align:center;min-width:90px}
.flow-box.stop{background:#dc2626}
.flow-box.go{background:#16a34a}
.flow-box.qr{background:#F5A51A;color:#101B4D}
.flow-arrow{color:#263A8B;font-weight:900;font-size:1.2rem}
/* QR COMMANDS */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.qr-card{border-radius:10px;padding:14px;text-align:center;font-size:.83rem;font-weight:600}
.qr-start{background:#dcfce7;border:2px solid #16a34a;color:#166534}
.qr-stop{background:#fee2e2;border:2px solid #dc2626;color:#991b1b}
.qr-pause{background:#dbeafe;border:2px solid #2563eb;color:#1e40af}
/* SPEC TABLE */
.spec-table{width:100%;border-collapse:collapse;font-size:.83rem}
.spec-table td{padding:7px 10px;border-bottom:1px solid #e5e7eb}
.spec-table td:first-child{font-weight:600;color:#263A8B;width:45%}
.spec-table tr:nth-child(even) td{background:#f9fafb}
/* QUIZ */
.quiz-score-bar{background:#EEF2FF;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.score-display{font-size:1.3rem;font-weight:800;color:#263A8B}
.quiz-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:14px}
.quiz-q{font-weight:700;font-size:.88rem;color:#111827;margin-bottom:10px}
.quiz-opt{display:block;width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;margin-bottom:6px;font-size:.84rem;transition:.15s}
.quiz-opt:hover:not(.disabled){background:#EEF2FF;border-color:#263A8B}
.quiz-opt.correct{background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:600}
.quiz-opt.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.quiz-opt.disabled{cursor:not-allowed;opacity:.85}
.quiz-feedback{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.82rem;display:none}
.quiz-feedback.ok{background:#dcfce7;color:#166534;display:block}
.quiz-feedback.bad{background:#fee2e2;color:#991b1b;display:block}
#quizResult{display:none;margin-top:16px}
.result-card{border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.result-pass{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:2px solid #16a34a}
.result-fail{background:linear-gradient(135deg,#fee2e2,#fecaca);border:2px solid #dc2626}
.result-score{font-size:2rem;font-weight:900;margin:6px 0}
/* PDF FORM */
#pdfFormWrap{display:none;background:#fff;border-radius:12px;border:2px solid #263A8B;padding:20px;margin-top:16px}
#pdfFormWrap h3{color:#263A8B;margin-bottom:14px;font-size:.95rem}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:4px}
.form-group input,.form-group select{width:100%;border:1.5px solid #d1d5db;border-radius:7px;padding:8px 10px;font-size:.85rem;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{border-color:#263A8B}
.btn-pdf{background:linear-gradient(135deg,#263A8B,#101B4D);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:.87rem;font-weight:700;cursor:pointer;margin-right:8px;margin-top:4px}
.btn-reset{background:#6b7280;color:#fff;border:none;border-radius:8px;padding:11px 16px;font-size:.87rem;font-weight:600;cursor:pointer;margin-top:4px}
/* ACHIEVE GRID */
.achieve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.achieve-card{background:#EEF2FF;border:1.5px solid #c7d2fe;border-radius:10px;padding:14px;text-align:center;font-size:.82rem}
.achieve-card .a-icon{font-size:1.5rem;margin-bottom:6px}
.achieve-card strong{color:#263A8B;display:block;margin-bottom:4px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;width:90%;max-width:480px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box h3{color:#263A8B;margin-bottom:12px;font-size:1rem}
.modal-preview{font-size:.82rem;line-height:1.8;white-space:pre-wrap;color:#374151;background:#f9fafb;border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;margin-bottom:14px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-confirm{background:#16a34a;color:#fff;border:none;border-radius:7px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.85rem}
.btn-cancel{background:#6b7280;color:#fff;border:none;border-radius:7px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:.85rem}
/* RESPONSIVE */
@media(max-width:600px){.comp-grid{grid-template-columns:repeat(2,1fr)}.tab-btn{font-size:.7rem;padding:9px 8px}}

    &lt;img src=&quot;https://i.imgur.com/placeholder.png&quot; alt=&quot;SmartLine QR Rover&quot; class=&quot;hero-img&quot; onerror=&quot;this.style.display=&#39;none&#39;&quot;&gt;
    &lt;div class=&quot;highlight-box&quot;&gt;
      &lt;strong&gt;Definisi Ringkas:&lt;/strong&gt; SmartLine QR Rover ialah &lt;strong&gt;kenderaan robot berautonomi&lt;/strong&gt; yang boleh mengikut garisan, mengesan halangan, dan menerima arahan kawalan melalui kod QR — tanpa perlu dipegang atau dikontrol secara manual.
    &lt;/div&gt;
    &lt;p&gt;Bayangkan sebuah troli gudang yang boleh bergerak sendiri mengikut laluan yang ditanda, berhenti bila ada halangan, dan menerima arahan &quot;mula&quot; atau &quot;berhenti&quot; hanya dengan menunjukkan kod QR. Itulah konsep asas SmartLine QR Rover!&lt;/p&gt;
    &lt;h3&gt;Kenapa projek ini penting?&lt;/h3&gt;
    &lt;p&gt;Dalam dunia Industry 4.0, sistem seperti ini digunakan secara meluas dalam:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Automated Guided Vehicle (AGV)&lt;/strong&gt; — kenderaan berautonomi di kilang dan gudang&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Smart Warehouse&lt;/strong&gt; — sistem pengurusan stor automatik&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Robotik Pendidikan&lt;/strong&gt; — platform pembelajaran STEM dan TVET&lt;/li&gt;
    &lt;/ul&gt;

      &lt;tr&gt;&lt;td&gt;Cara kawalan&lt;/td&gt;&lt;td&gt;Joystick / remote&lt;/td&gt;&lt;td&gt;QR Code / Sensor automatik&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Kesan halangan&lt;/td&gt;&lt;td&gt;Bergantung pada operator&lt;/td&gt;&lt;td&gt;Automatik (sensor ultrasonik)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ikut laluan&lt;/td&gt;&lt;td&gt;Dikawal tangan&lt;/td&gt;&lt;td&gt;Automatik (sensor garisan)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Penglihatan AI&lt;/td&gt;&lt;td&gt;Tiada&lt;/td&gt;&lt;td&gt;HuskyLens AI Vision&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Kegunaan industri&lt;/td&gt;&lt;td&gt;Terhad&lt;/td&gt;&lt;td&gt;AGV, gudang pintar, pendidikan&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;

      &lt;strong&gt;&amp;#9888; Penting:&lt;/strong&gt; SmartLine QR Rover bergerak secara AUTOMATIK. Pastikan kawasan laluan bersih dan tiada orang atau objek berharga di depan rover semasa pengujian.

    &lt;ul class=&quot;obj-list&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;1&lt;/span&gt;&lt;span&gt;Menjelaskan konsep kenderaan berautonomi pengikut garisan dan peranannya dalam Industry 4.0 serta sistem AGV.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;2&lt;/span&gt;&lt;span&gt;Mengenal pasti dan menerangkan fungsi setiap komponen utama SmartLine QR Rover termasuk HuskyLens, sensor ultrasonik, dan sensor garisan.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;3&lt;/span&gt;&lt;span&gt;Menerangkan cara sistem kawalan QR Code berfungsi melalui HuskyLens AI Vision untuk mengawal pergerakan rover.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;4&lt;/span&gt;&lt;span&gt;Menganalisis aliran operasi rover merangkumi pengikutan garisan, pengesanan halangan, berhenti automatik, dan sambungan semula.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;5&lt;/span&gt;&lt;span&gt;Menguji sistem rover mengikut prosedur ujian yang betul dan selamat dalam persekitaran makmal.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;obj-icon&quot;&gt;6&lt;/span&gt;&lt;span&gt;Menghubungkaitkan teknologi SmartLine QR Rover dengan aplikasi dunia sebenar dalam industri dan STEM/TVET.&lt;/span&gt;&lt;/li&gt;

&lt;!-- ==================== TAB 2: TEORI ==================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;sec2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;Teori: Cara SmartLine QR Rover Bekerja&lt;/h2&gt;

    &lt;h3&gt;1. Pengikutan Garisan (Line Following)&lt;/h3&gt;
    &lt;div class=&quot;highlight-box&quot;&gt;
      &lt;strong&gt;Analogi mudah:&lt;/strong&gt; Bayangkan anda berjalan mengikut garisan putih di padang bola. Mata anda membaca garisan itu dan kaki anda menyesuaikan arah. Begitulah cara sensor garisan rover membaca laluan!
    &lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;Sensor Garisan Array&lt;/strong&gt; menggunakan cahaya inframerah (IR) untuk mengesan perbezaan warna antara garisan (biasanya hitam) dan permukaan lantai (biasanya putih). Apabila sensor membaca garisan, ia menghantar isyarat ke mikropengawal supaya motor diselaraskan.&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;Sensor kiri aktif &amp;rarr; putar ke kiri&lt;/li&gt;
      &lt;li&gt;Sensor kanan aktif &amp;rarr; putar ke kanan&lt;/li&gt;
      &lt;li&gt;Semua sensor aktif &amp;rarr; gerak lurus&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;2. Pengesanan Halangan (Obstacle Detection)&lt;/h3&gt;
    &lt;p&gt;&lt;strong&gt;Sensor Ultrasonik&lt;/strong&gt; bekerja seperti sonar kelawar — ia memancarkan gelombang bunyi ultrasonik ke hadapan dan mengukur masa pantulan. Jika objek berada dalam jarak tertentu (contoh: kurang dari 20 cm), rover berhenti serta-merta.&lt;/p&gt;
    &lt;div class=&quot;highlight-box&quot;&gt;
      &lt;strong&gt;Formula jarak:&lt;/strong&gt; Jarak (cm) = Masa pantulan (ms) &amp;divide; 58
    &lt;/div&gt;
    &lt;p&gt;Selepas halangan disingkirkan, rover meneruskan perjalanan secara automatik — tiada campur tangan manusia diperlukan.&lt;/p&gt;

    &lt;h3&gt;3. Pengesanan QR Code dengan HuskyLens AI&lt;/h3&gt;
    &lt;p&gt;&lt;strong&gt;HuskyLens&lt;/strong&gt; ialah kamera AI pintar yang boleh mengenali pelbagai objek termasuk kod QR. Ia berbeza daripada kamera biasa kerana ia memproses imej secara DALAMAN menggunakan AI — mikropengawal hanya perlu membaca hasil pengesanan melalui komunikasi I2C atau UART.&lt;/p&gt;
    &lt;table class=&quot;skill-table&quot;&gt;
      &lt;tr&gt;&lt;th&gt;Kod QR&lt;/th&gt;&lt;th&gt;Arahan&lt;/th&gt;&lt;th&gt;Tindakan Rover&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;QR START&lt;/td&gt;&lt;td&gt;Mula bergerak&lt;/td&gt;&lt;td&gt;Motor aktif, ikut garisan&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;QR STOP&lt;/td&gt;&lt;td&gt;Berhenti&lt;/td&gt;&lt;td&gt;Motor berhenti&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;QR PAUSE&lt;/td&gt;&lt;td&gt;Berhenti sementara&lt;/td&gt;&lt;td&gt;Motor berhenti, boleh sambung&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;

    &lt;h3&gt;4. Logik Kawalan Utama (Pseudokod)&lt;/h3&gt;
    &lt;div class=&quot;highlight-box&quot; style=&quot;font-family:monospace;font-size:.82rem&quot;&gt;
      JIKA QR_START dikesan:&lt;br&gt;
      &amp;nbsp;&amp;nbsp;aktifkan_motor()&lt;br&gt;
      JIKA halangan_dikesan (jarak &amp;lt; 20cm):&lt;br&gt;
      &amp;nbsp;&amp;nbsp;berhenti_motor()&lt;br&gt;
      &amp;nbsp;&amp;nbsp;TUNGGU sehingga halangan hilang&lt;br&gt;
      &amp;nbsp;&amp;nbsp;teruskan_motor()&lt;br&gt;
      JIKA QR_STOP dikesan:&lt;br&gt;
      &amp;nbsp;&amp;nbsp;berhenti_motor()
    &lt;/div&gt;

    &lt;h3&gt;5. Komunikasi Komponen&lt;/h3&gt;
    &lt;p&gt;Semua komponen berkomunikasi dengan &lt;strong&gt;Mikropengawal (Arduino)&lt;/strong&gt; sebagai otak utama:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;HuskyLens&lt;/strong&gt; &amp;rarr; I2C / UART ke Arduino&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Sensor Ultrasonik&lt;/strong&gt; &amp;rarr; Pin digital Arduino (Trigger &amp;amp; Echo)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Sensor Garisan&lt;/strong&gt; &amp;rarr; Pin analog/digital Arduino&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Motor Driver&lt;/strong&gt; &amp;rarr; PWM dari Arduino ke motor DC&lt;/li&gt;
    &lt;/ul&gt;

&lt;/div&gt;

    &lt;h2&gt;Amali: Ujian Operasi SmartLine QR Rover&lt;/h2&gt;
    &lt;div class=&quot;highlight-box&quot;&gt;
      &lt;strong&gt;Nota Pelajar:&lt;/strong&gt; Amali ini adalah aktiviti &lt;strong&gt;pemerhatian dan pengujian terpandu&lt;/strong&gt;. Ikut setiap langkah dengan teliti. Jangan ubah sebarang sambungan perkakasan tanpa kebenaran pensyarah.
    &lt;/div&gt;

&lt;/div&gt;

&lt;!-- MODAL PRATONTON PDF --&gt;
&lt;div class=&quot;modal-overlay&quot; id=&quot;modalOverlay&quot;&gt;
  &lt;div class=&quot;modal-box&quot;&gt;
    &lt;h3&gt;Pratonton Slip Keputusan&lt;/h3&gt;
    &lt;div class=&quot;modal-preview&quot; id=&quot;modalPreview&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;btn-row&quot;&gt;
      &lt;button class=&quot;btn-confirm&quot; onclick=&quot;janaPDF()&quot;&gt;Muat Turun PDF&lt;/button&gt;
      &lt;button class=&quot;btn-cancel&quot; onclick=&quot;tutupModal()&quot;&gt;Batal&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const PROGRESS = [14,28,42,57,71,85,100];
const TAB_LABELS = [&#39;Pengenalan&#39;,&#39;Objektif&#39;,&#39;Teori&#39;,&#39;Komponen&#39;,&#39;Amali&#39;,&#39;Kuiz&#39;,&#39;Rumusan&#39;];
let quizScore = 0, quizAnswered = 0;
const JUMLAH = 8;

function goTab(idx){
  document.querySelectorAll(&#39;.section&#39;).forEach(s=&gt;s.classList.remove(&#39;active&#39;));
  document.querySelectorAll(&#39;.tab-btn&#39;).forEach(b=&gt;b.classList.remove(&#39;active&#39;));
  document.getElementById(&#39;sec&#39;+idx).classList.add(&#39;active&#39;);
  document.querySelectorAll(&#39;.tab-btn&#39;)[idx].classList.add(&#39;active&#39;);
  updateTracker(idx);
  window.scrollTo({top:0,behavior:&#39;smooth&#39;});
}
function updateTracker(idx){
  document.getElementById(&#39;progressBar&#39;).style.width=PROGRESS[idx]+&#39;%&#39;;
  document.getElementById(&#39;progPct&#39;).textContent=PROGRESS[idx]+&#39;%&#39;;
  for(let i=0;i&lt;7;i++){
    const d=document.getElementById(&#39;dot&#39;+i);
    d.classList.remove(&#39;active&#39;,&#39;done&#39;);
    if(i&lt;idx) d.classList.add(&#39;done&#39;);
    else if(i===idx) d.classList.add(&#39;active&#39;);
  }
}
function getFeedback(q,betul){
  const fb={
    1:[&#39;Sensor garisan menggunakan cahaya inframerah (IR) untuk membezakan garisan hitam dan permukaan cerah.&#39;,&#39;Jawapan betul ialah B — sensor inframerah (IR) yang mengesan garisan.&#39;],
    2:[&#39;HuskyLens memproses imej secara dalaman dengan AI dan menghantar hasil pengesanan ke Arduino.&#39;,&#39;Jawapan betul ialah C — HuskyLens mengenali QR Code menggunakan AI dalaman.&#39;],
    3:[&#39;Selepas berhenti, rover akan teruskan sendiri apabila halangan tiada — tiada tindakan manusia diperlukan.&#39;,&#39;Jawapan betul ialah B — berhenti serta-merta dan menunggu.&#39;],
    4:[&#39;AGV ialah Automated Guided Vehicle — kenderaan berautonomi yang digunakan dalam industri.&#39;,&#39;Jawapan betul ialah B — Automated Guided Vehicle.&#39;],
    5:[&#39;Voltan 7.4V-12V sesuai untuk motor DC dan elektronik dalam sistem ini.&#39;,&#39;Jawapan betul ialah C — 7.4V hingga 12V DC.&#39;],
    6:[&#39;I2C dan UART adalah protokol komunikasi berwayar yang biasa digunakan dalam robotik.&#39;,&#39;Jawapan betul ialah B — I2C atau UART.&#39;],
    7:[&#39;Arduino memproses semua isyarat dari sensor dan menghantar arahan ke motor driver.&#39;,&#39;Jawapan betul ialah C — Mikropengawal Arduino.&#39;],
    8:[&#39;Akrilik dan plastik dipilih kerana ringan, murah, dan mudah diproses untuk prototaip.&#39;,&#39;Jawapan betul ialah B — Akrilik dan plastik.&#39;]
  };
  return fb[q][betul?0:1];
}
function jawab(q,btn,betul){
  btn.parentElement.querySelectorAll(&#39;.quiz-opt&#39;).forEach(b=&gt;{b.classList.add(&#39;disabled&#39;);b.disabled=true;});
  const fb=document.getElementById(&#39;fb&#39;+q);
  fb.style.display=&#39;block&#39;;
  if(betul){
    btn.classList.add(&#39;correct&#39;);
    fb.classList.add(&#39;ok&#39;);
    fb.textContent=&#39;Betul! Syabas! &#39;+getFeedback(q,true);
    quizScore++;
  } else {
    btn.classList.add(&#39;wrong&#39;);
    fb.classList.add(&#39;bad&#39;);
    fb.textContent=&#39;Tidak tepat. &#39;+getFeedback(q,false);
    btn.parentElement.querySelectorAll(&#39;.quiz-opt&#39;).forEach(b=&gt;{
      if(b.onclick&amp;&amp;b.onclick.toString().includes(&#39;,true&#39;))b.classList.add(&#39;correct&#39;);
    });
  }
  quizAnswered++;
  document.getElementById(&#39;scoreDisplay&#39;).textContent=quizScore+&#39;/&#39;+quizAnswered;
  if(quizAnswered===JUMLAH) paparKeputusan();
}
function paparKeputusan(){
  const hasil=document.getElementById(&#39;quizResult&#39;);
  const kad=document.getElementById(&#39;resultCard&#39;);
  const lulus=quizScore&gt;=6;
  hasil.style.display=&#39;block&#39;;
  kad.className=&#39;result-card &#39;+(lulus?&#39;result-pass&#39;:&#39;result-fail&#39;);
  document.getElementById(&#39;resultTitle&#39;).textContent=lulus?&#39;TAHNIAH! ANDA LULUS!&#39;:&#39;BELUM LULUS — CUBA LAGI&#39;;
  document.getElementById(&#39;resultScore&#39;).textContent=quizScore+&#39;/&#39;+JUMLAH;
  document.getElementById(&#39;resultMsg&#39;).textContent=lulus
    ?&#39;Markah anda mencukupi. Sila jana slip keputusan anda di bawah.&#39;
    :&#39;Anda perlu sekurang-kurangnya 6/8 untuk lulus. Ulang kaji dan cuba semula.&#39;;
  document.getElementById(&#39;pdfFormWrap&#39;).style.display=&#39;block&#39;;
  document.getElementById(&#39;pdfFormWrap&#39;).scrollIntoView({behavior:&#39;smooth&#39;});
}
function formatIC(input){
  let v=input.value.replace(/\D/g,&#39;&#39;).substring(0,12);
  if(v.length&gt;8) v=v.substring(0,6)+&#39;-&#39;+v.substring(6,8)+&#39;-&#39;+v.substring(8);
  else if(v.length&gt;6) v=v.substring(0,6)+&#39;-&#39;+v.substring(6);
  input.value=v;
}
function tunjukModal(){
  const nama=document.getElementById(&#39;inputNama&#39;).value.trim();
  const ic=document.getElementById(&#39;inputIC&#39;).value.trim();
  const prog=document.getElementById(&#39;inputProgram&#39;).value.trim();
  const inst=document.getElementById(&#39;inputInstitusi&#39;).value.trim();
  if(!nama||!ic||!prog||!inst){alert(&#39;Sila lengkapkan semua maklumat terlebih dahulu.&#39;);return;}
  const icRegex=/^\d{6}-\d{2}-\d{4}$/;
  if(!icRegex.test(ic)){alert(&#39;Format No. IC tidak sah. Contoh: 001231-14-5678&#39;);return;}
  const lulus=quizScore&gt;=6;
  const status=lulus?&#39;[LULUS]&#39;:&#39;[TIDAK LULUS]&#39;;
  const tarikhMasa=new Date().toLocaleString(&#39;ms-MY&#39;);
  let det=&#39;&#39;;
  const labels=[&#39;Jenis sensor pengikut garisan&#39;,&#39;Fungsi HuskyLens&#39;,&#39;Tindakan kesan halangan&#39;,&#39;Singkatan AGV&#39;,&#39;Julat voltan&#39;,&#39;Protokol komunikasi HuskyLens&#39;,&#39;Otak utama sistem&#39;,&#39;Bahan casis&#39;];
  for(let i=1;i&lt;=JUMLAH;i++){
    const card=document.getElementById(&#39;q&#39;+i);
    const b=card.querySelector(&#39;.quiz-opt.correct&#39;);
    const jwp=b?&#39;[BETUL]&#39;:&#39;[SALAH]&#39;;
    det+=`S${i}: ${jwp} - ${labels[i-1]}\n`;
  }
  const preview=`
SLIP KEPUTUSAN KUIZ
ADTEC JTM KAMPUS KUALA LUMPUR
==================================
Modul   : SmartLine QR Rover
Tarikh  : ${tarikhMasa}

MAKLUMAT PELAJAR
----------------------------------
Nama    : ${nama}
No. IC  : ${ic}
Program : ${prog}
Institusi: ${inst}

KEPUTUSAN
----------------------------------
Markah  : ${quizScore} / ${JUMLAH}
Peratusan: ${Math.round(quizScore/JUMLAH*100)}%
Status  : ${status}
Had Lulus: 6/8 (75%)

BUTIRAN JAWAPAN
----------------------------------
${det}
==================================
Dokumen ini dijana secara automatik.
`;
  document.getElementById(&#39;modalPreview&#39;).textContent=preview;
  document.getElementById(&#39;modalOverlay&#39;).classList.add(&#39;show&#39;);
}
function tutupModal(){document.getElementById(&#39;modalOverlay&#39;).classList.remove(&#39;show&#39;);}
function janaPDF(){
  const nama=document.getElementById(&#39;inputNama&#39;).value.trim();
  const ic=document.getElementById(&#39;inputIC&#39;).value.trim();
  const prog=document.getElementById(&#39;inputProgram&#39;).value.trim();
  const inst=document.getElementById(&#39;inputInstitusi&#39;).value.trim();
  const lulus=quizScore&gt;=6;
  const tarikhMasa=new Date().toLocaleString(&#39;ms-MY&#39;);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const W=doc.internal.pageSize.getWidth();
  // Header
  doc.setFillColor(16,27,77);
  doc.rect(0,0,W,32,&#39;F&#39;);
  doc.setTextColor(245,165,26);
  doc.setFontSize(14);doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);
  doc.text(&#39;ADTEC JTM KAMPUS KUALA LUMPUR&#39;,W/2,13,{align:&#39;center&#39;});
  doc.setTextColor(255,255,255);
  doc.setFontSize(11);
  doc.text(&#39;SLIP KEPUTUSAN KUIZ&#39;,W/2,22,{align:&#39;center&#39;});
  doc.setFontSize(9);
  doc.text(&#39;SmartLine QR Rover | Modul Pembelajaran Interaktif&#39;,W/2,29,{align:&#39;center&#39;});
  // Gold line
  doc.setFillColor(245,165,26);
  doc.rect(0,32,W,2,&#39;F&#39;);
  // Info pelajar
  doc.setTextColor(16,27,77);
  doc.setFontSize(11);doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);
  doc.text(&#39;MAKLUMAT PELAJAR&#39;,14,42);
  doc.setDrawColor(38,58,139);doc.setLineWidth(0.5);
  doc.line(14,44,W-14,44);
  doc.setFont(&#39;helvetica&#39;,&#39;normal&#39;);doc.setFontSize(10);doc.setTextColor(55,65,81);
  const info=[[&#39;Nama&#39;,nama],[&#39;No. Kad Pengenalan&#39;,ic],[&#39;Program / Kursus&#39;,prog],[&#39;Institusi&#39;,inst],[&#39;Tarikh &amp; Masa&#39;,tarikhMasa]];
  let y=51;
  info.forEach(([l,v])=&gt;{
    doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);doc.setTextColor(38,58,139);doc.text(l+&#39; :&#39;,14,y);
    doc.setFont(&#39;helvetica&#39;,&#39;normal&#39;);doc.setTextColor(55,65,81);doc.text(v,65,y);
    y+=7;
  });
  // Keputusan
  y+=3;
  doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);doc.setFontSize(11);doc.setTextColor(16,27,77);
  doc.text(&#39;KEPUTUSAN KUIZ&#39;,14,y);y+=3;
  doc.line(14,y,W-14,y);y+=8;
  const pct=Math.round(quizScore/JUMLAH*100);
  doc.setFillColor(lulus?220:254,lulus?252:226,lulus?231:226);
  doc.roundedRect(14,y-5,W-28,28,3,3,&#39;F&#39;);
  doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);doc.setFontSize(20);
  doc.setTextColor(lulus?22:185,lulus?163:28,lulus?74:26);
  doc.text(quizScore+&#39; / &#39;+JUMLAH,W/2,y+8,{align:&#39;center&#39;});
  doc.setFontSize(10);
  doc.text(pct+&#39;% | Had Lulus: 75%&#39;,W/2,y+16,{align:&#39;center&#39;});
  doc.setFontSize(12);
  doc.text(lulus?&#39;[LULUS]&#39;:&#39;[TIDAK LULUS]&#39;,W/2,y+24,{align:&#39;center&#39;});
  y+=35;
  // Butiran
  doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);doc.setFontSize(11);doc.setTextColor(16,27,77);
  doc.text(&#39;BUTIRAN JAWAPAN&#39;,14,y);y+=3;
  doc.line(14,y,W-14,y);y+=7;
  const labels=[&#39;Sensor pengikut garisan&#39;,&#39;Fungsi HuskyLens&#39;,&#39;Tindakan kesan halangan&#39;,&#39;Singkatan AGV&#39;,&#39;Julat voltan operasi&#39;,&#39;Protokol komunikasi HuskyLens&#39;,&#39;Otak utama sistem&#39;,&#39;Bahan casis rover&#39;];
  doc.setFontSize(9);
  for(let i=1;i&lt;=JUMLAH;i++){
    const card=document.getElementById(&#39;q&#39;+i);
    const b=card.querySelector(&#39;.quiz-opt.correct&#39;);
    const jwp=b?&#39;[BETUL]&#39;:&#39;[SALAH]&#39;;
    const clr=b?[22,163,74]:[185,28,28];
    doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);doc.setTextColor(...clr);doc.text(jwp,14,y);
    doc.setFont(&#39;helvetica&#39;,&#39;normal&#39;);doc.setTextColor(55,65,81);doc.text(&#39;S&#39;+i+&#39;: &#39;+labels[i-1],36,y);
    y+=6;
  }
  // Footer
  y=doc.internal.pageSize.getHeight()-14;
  doc.setFillColor(16,27,77);doc.rect(0,y-5,W,19,&#39;F&#39;);
  doc.setFontSize(8);doc.setTextColor(245,165,26);doc.setFont(&#39;helvetica&#39;,&#39;bold&#39;);
  doc.text(&#39;ADTEC JTM Kampus Kuala Lumpur | Jabatan Tenaga Manusia&#39;,W/2,y+1,{align:&#39;center&#39;});
  doc.setTextColor(200,210,255);doc.setFont(&#39;helvetica&#39;,&#39;normal&#39;);
  doc.text(&#39;Dokumen ini dijana secara automatik oleh sistem e-Pembelajaran.&#39;,W/2,y+7,{align:&#39;center&#39;});
  const namaFail=&#39;Keputusan_QR_Rover_&#39;+nama.replace(/\s+/g,&#39;_&#39;)+&#39;_&#39;+ic.replace(/-/g,&#39;&#39;)+&#39;.pdf&#39;;
  doc.save(namaFail);
  tutupModal();
}
function resetKuiz(){
  quizScore=0;quizAnswered=0;
  document.getElementById(&#39;scoreDisplay&#39;).textContent=&#39;0/0&#39;;
  document.getElementById(&#39;quizResult&#39;).style.display=&#39;none&#39;;
  document.getElementById(&#39;pdfFormWrap&#39;).style.display=&#39;none&#39;;
  document.getElementById(&#39;inputNama&#39;).value=&#39;&#39;;
  document.getElementById(&#39;inputIC&#39;).value=&#39;&#39;;
  document.getElementById(&#39;inputProgram&#39;).value=&#39;&#39;;
  document.getElementById(&#39;inputInstitusi&#39;).value=&#39;ADTEC JTM Kampus Kuala Lumpur&#39;;
  for(let i=1;i&lt;=JUMLAH;i++){
    const card=document.getElementById(&#39;q&#39;+i);
    card.querySelectorAll(&#39;.quiz-opt&#39;).forEach(b=&gt;{b.classList.remove(&#39;correct&#39;,&#39;wrong&#39;,&#39;disabled&#39;);b.disabled=false;});
    const fb=document.getElementById(&#39;fb&#39;+i);
    fb.classList.remove(&#39;ok&#39;,&#39;bad&#39;);fb.textContent=&#39;&#39;;fb.style.display=&#39;none&#39;;
  }
  goTab(5);
}
